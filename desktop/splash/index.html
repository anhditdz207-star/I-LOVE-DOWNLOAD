<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I LOVE DOWNLOAD</title>
<style>
  html,body{height:100%;margin:0;background:#0e1430;color:#eef1ff;font-family:system-ui,'Segoe UI',sans-serif}
  body{display:grid;place-items:center;text-align:center}
  img{width:96px;height:96px;image-rendering:auto}
  h1{font:400 28px Impact,'Arial Narrow',sans-serif;letter-spacing:.08em;margin:12px 0 4px}
  p{opacity:.75;margin:0}
  i{display:inline-block;width:12px;height:12px;margin:14px 3px 0;background:#c4584a;animation:hop .9s steps(2) infinite}
  i:nth-child(2){animation-delay:.15s}i:nth-child(3){animation-delay:.3s}
  @keyframes hop{50%{transform:translateY(-8px)}}
</style></head>
<body><main>
  <img src="logo.png" alt="">
  <h1>I LOVE DOWNLOAD</h1>
  <p id="msg">Đang khởi động...</p>
  <div><i></i><i></i><i></i></div>
</main>
<script>
  const url = 'http://127.0.0.1:18765/';
  let tries = 0;
  (async function wait() {
    try { await fetch(url + 'healthz', { mode: 'no-cors', cache: 'no-store' }); location.replace(url); return } catch (e) {}
    if (++tries > 200) { document.getElementById('msg').textContent = 'Không khởi động được máy chủ nội bộ. Hãy đóng app và mở lại.'; return }
    setTimeout(wait, 400)
  })()
</script></body></html>
